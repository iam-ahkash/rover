<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Rover 3D</title>
<style>
  :root { --bg: #f4f6f9; --fg: #1a1a1a; --panel: rgba(255,255,255,.92); --line: #d5dae1; --accent: #2b6cb0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15181d; --fg: #e8eaed; --panel: rgba(30,34,40,.92); --line: #3a404a; --accent: #6ea8ff; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: absolute; top: 12px; left: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; max-width: calc(100vw - 48px); }
  #ui h1 { font-size: 14px; margin: 0 0 6px; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #pick { margin-top: 8px; min-height: 1.2em; color: var(--accent); }
  body.shot #ui { display: none; }
  body.shot { background: #ffffff; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="ui">
  <h1>Delivery rover · __DIMS__ mm</h1>
  <div class="row">
    <button data-view="iso">3D</button><button data-view="front">Front</button><button data-view="side">Side</button>
    <button data-view="top">Top</button><button data-view="under">Under</button>
  </div>
  <div class="row">
    <button data-toggle="cover" class="on">Walls</button><button data-toggle="lid" class="on">Lid</button>
    <button data-toggle="box" class="on">Box</button><button data-toggle="payload" class="on">5 kg package</button>
  </div>
  <div id="pick">Drag to turn · scroll to zoom · click a part to name it</div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const q = new URLSearchParams(location.search);
const shot = q.has("shot");
if (shot) document.body.classList.add("shot");

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(shot ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(shot ? "#ffffff" : getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-0.8, 1.6, 1.1);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.003;
Object.assign(sun.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1, near: 0.1, far: 6 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(1, 0.5, -1); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(1.2, 12, 0x9aa3ad, 0xc9ced6); grid.material.transparent = true; grid.material.opacity = shot ? 0.0 : 0.5; scene.add(grid);

const ortho = ["front", "side", "top", "under"].includes(q.get("view"));
const aspect = innerWidth / innerHeight;
const camera = ortho ? new THREE.OrthographicCamera(-0.36 * aspect, 0.36 * aspect, 0.36, -0.36, 0.01, 10)
                     : new THREE.PerspectiveCamera(32, aspect, 0.01, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.16, 0);

// rover front = glTF -Z, rover left = glTF -X
const views = {
  iso:   [[-0.85, 0.7, -1.0], [0, 0.17, 0]],
  rear:  [[0.85, 0.72, 0.98], [0, 0.17, 0]],
  low:   [[-0.9, 0.08, -0.7], [0.02, 0.17, 0.04]],
  bay:   [[-0.55, 0.62, -0.6], [0, 0.08, 0]],
  front: [[0, 0.17, -3], [0, 0.17, 0]],
  side:  [[-3, 0.17, 0], [0, 0.17, 0]],
  top:   [[0, 3, 0.0001], [0, 0, 0]],
  under: [[0, -3, 0.0001], [0, 0, 0]],
};
function setView(v) {
  const [p, t] = views[v] || views.iso;
  camera.position.set(...p); controls.target.set(...t);
  if (v === "top") camera.up.set(1, 0, 0), camera.position.set(0, 3, 0);
  else if (v === "under") camera.up.set(-1, 0, 0), camera.position.set(0, -3, 0);
  else camera.up.set(0, 1, 0);
  camera.lookAt(...t); controls.update();
}

const groups = { cover: [], lid: [], box: [], payload: [] };
const bytes = Uint8Array.from(atob("__GLB_BASE64__"), c => c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer, "", gltf => {
  const root = gltf.scene;
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const n = o.name || o.parent?.name || "";
    if (n.startsWith("Wall_")) groups.cover.push(o);
    if (n.startsWith("Cargo_box_lid")) groups.lid.push(o);
    if (n.startsWith("Cargo_box_48L") || n.startsWith("Webcam") || n.startsWith("Servo")) groups.box.push(o);
    if (n.startsWith("Payload")) groups.payload.push(o);
    if (o.material.transparent) o.castShadow = false;
  });
  scene.add(root);
  for (const k of ["cover", "lid", "box", "payload"]) {
    if (q.get(k) === "0") { groups[k].forEach(o => (o.visible = false)); document.querySelector(`[data-toggle=${k}]`)?.classList.remove("on"); }
  }
  setView(q.get("view") || "iso");
  renderer.render(scene, camera);
  window.__ready = true;
});

document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
  const on = b.classList.toggle("on");
  groups[b.dataset.toggle].forEach(o => (o.visible = on));
});
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
renderer.domElement.addEventListener("click", e => {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(scene.children, true).find(h => h.object.isMesh && h.object.visible && h.object !== ground);
  document.getElementById("pick").textContent = hit ? (hit.object.name || hit.object.parent.name).replaceAll("_", " ") : "";
});
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  if (camera.isPerspectiveCamera) camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
